[build-system]
requires = ["setuptools>=66.1"]
build-backend = "setuptools.build_meta"

[project]
name = "fem-learning-laboratory"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.30,<1",
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "sympy>=1.12,<2",
    "pydantic>=2.5,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.vercel]
entrypoint = "backend.app:app"
